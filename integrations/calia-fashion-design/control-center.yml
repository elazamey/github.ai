name: Report Gate 0 Evidence to Control Center

on:
  push:
    branches: [main]

jobs:
  report-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CONTROL_CENTER_URL: ${{ secrets.CONTROL_CENTER_URL }}
      CONTROL_CENTER_INGEST_TOKEN: ${{ secrets.CONTROL_CENTER_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Send Gate 0 Evidence
        if: ${{ env.CONTROL_CENTER_URL != '' && env.CONTROL_CENTER_INGEST_TOKEN != '' }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "$CONTROL_CENTER_URL/api/v1/evidence" \
            --header "Authorization: Bearer $CONTROL_CENTER_INGEST_TOKEN" \
            --header "Content-Type: application/json" \
            --data @- <<JSON
          {
            "repository": "${{ github.repository }}",
            "gateIndex": 0,
            "sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "workflowRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "workflowRunId": "${{ github.run_id }}",
            "checks": [
              {"name":"structure","status":"PASS","details":"Control Center bridge executed on the repository baseline."},
              {"name":"evidence","status":"PASS","details":"GitHub Actions submitted Evidence to the Control Center."}
            ]
          }
          JSON
      - name: Control Center bridge not configured
        if: ${{ env.CONTROL_CENTER_URL == '' || env.CONTROL_CENTER_INGEST_TOKEN == '' }}
        run: echo "Control Center URL or ingestion token is not configured; Evidence submission was skipped."
