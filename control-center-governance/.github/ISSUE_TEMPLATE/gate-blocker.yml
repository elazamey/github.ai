name: Gate Blocker
description: تسجيل شرط يمنع الانتقال إلى Gate لاحق
title: "[BLOCK] "
labels:
  - gate-blocker
body:
  - type: input
    id: project
    attributes:
      label: المشروع
      description: اسم المشروع أو المستودع المتأثر
      placeholder: owner/repository
    validations:
      required: true
  - type: input
    id: gate
    attributes:
      label: Gate
      placeholder: gate-0
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: سبب الحجب
      description: اذكر الشرط والنتيجة والدليل المتاح
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: رابط Evidence أو Workflow Run أو SHA
    validations:
      required: true
  - type: textarea
    id: remediation
    attributes:
      label: الإجراء المطلوب
      description: ما الذي يجب إنجازه لإزالة الحجب؟
    validations:
      required: true
